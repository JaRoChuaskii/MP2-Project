        <h1 id="welcomeMessage">Hello</h1>
        <button id="logoutBtn" class="hidden">Logout</button>

        <script>
            //Retrieve the JSON string from localStorage
            const login_records = sessionStorage.getItem("login");

            if (login_records){
                console.log(login_records);
                var parsedUser = JSON.parse(login_records);
                console.log(parsedUser);
                console.log(typeof parsedUser);

                document.getElementById("welcomeMessage").innerHTML = `Hello ${parsedUser.name}`;
                document.getElementById("logoutBtn").classList.remove("hidden");

            }else{
                document.getElementById("welcomeMessage").innerHTML = `<a href = 'login.html'>LOGIN</a>`;
            }
        </script>
